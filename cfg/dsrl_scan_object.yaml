defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  job:
    chdir: False  # RoboTwin's envs module loads assets via paths relative to
                  # cwd (see env.py's module docstring / dsrl_env_pilot's fix)
                  # -- must stay at ROBOTWIN_ROOT, not hydra's own output dir.

name: scan_object_dsrl_${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
logdir: ${log_dir}/scan_object-dsrl/${name}
log_dir: ./logs

gap_ckpt_path: "/data/vxiao/bimanual_manipulation/GAP-tte-flattenmlp-concatdit-actionrope/data/outputs/2026.09.13/17.24.29_GAP_scan_object_actionrope-baseline/checkpoints/200.ckpt"
dynamics_ckpt_path: "/data/vxiao/bimanual_manipulation/dynamics-model-rollout-worldmodel/data/outputs/2026.09.28/19.53.05_GAP_scan_object_rollout-worldmodel/checkpoints/200.ckpt"
task_config: demo_clean_depth  # must have collect_wrist_camera + depth, see
                                # GAP-tte-.../task_config_templates/demo_clean_depth.yml

algorithm: dsrl_sac  # start here (simpler, see DSRL-reference/README.md's
                      # own tuning advice); dsrl_na is more sample-efficient
                      # but distills a Q-function -- worth trying once
                      # dsrl_sac's pipeline is confirmed working end to end.

seed: 1
device: cuda:0
use_wandb: True  # SB3's own train/* metrics reach wandb via
                 # train_dsrl_scan_object.py's _WandbOutputFormat
env_name: scan_object
obs_dim: null  # _TODO: = GAP's memory token count * feature_dim once flattened,
               # OR keep obs as the raw dict and skip SB3's flat-Box
               # observation_space entirely -- env.py's DSRLScanObjectEnv
               # doesn't build one yet, see its module docstring.
action_dim: 16   # GAP's raw action dim (2 arms x 8)
num_inference_steps: 0  # 0 = use the checkpoint's own deployed value (10).
                 # The only knob measured to change how much authority the
                 # DSRL noise action has: authority 0.0035 at 10 steps vs
                 # 0.046 at 1 (13.4x), with 2/3/5 all WORSE than 10 --
                 # tests/sweep_inference_steps_authority.py, 2026-10-19. Each
                 # DDIM step under prediction_type='sample' contracts toward
                 # the conditional mean, so more steps converge onto a fixed
                 # point independent of x_T. Setting 1 also makes the frozen
                 # policy weaker, so pair any change with a success-rate
                 # measurement at the same value.
act_steps: 16    # GAP's action horizon (same thing, same convention as
                 # this project's "H" everywhere else)

eval_interval: 1000
num_evals: 20
save_model_interval: 2000
save_replay_buffer: False
load_offline_data: False
deterministic_eval: False

env:
  n_envs: 1          # start single-env (SAPIEN is heavy; DSRL-reference's
                      # SubprocVecEnv parallelism is Robomimic/Gym-specific,
                      # not something env.py wires up yet)
  n_eval_envs: 1
  max_episode_steps: 300  # scan_object's step_lim elsewhere in this project
  eval_expert_check: True   # replicate RoboTwin's own scripted-expert seed
                    # filter in the EVAL env, so eval/success_rate_deterministic
                    # is P(success | expert solves) -- the same quantity every
                    # published GAP number is. Without it the metric is
                    # unconditioned over the raw seed stream, which is NOT
                    # comparable: measured 2026-10-19, the expert solves only
                    # ~28% of raw scan_object/demo_clean_depth seeds (0.2778 /
                    # 0.2793 / 0.2825 across three completed 50-episode evals'
                    # own stored seed lists), and GAP's
                    # scripts/eval_policy.py:254 hardcodes expert_check=True
                    # with no override. Comparing the two manufactured a
                    # phantom "35pp gap" that cost three falsified hypotheses.
                    # Costs ~3.6 expert runs per eval episode the first time a
                    # seed batch is seen; cached in
                    # results/expert_check_cache.json after that, and the eval
                    # env re-uses one fixed batch by design
                    # (DeterministicEvalCallback -> reset_seed_counter).
  train_expert_check: False  # the TRAINING env deliberately keeps every seed:
                    # plan_success=False is the hand-written expert's own
                    # IK/planning failure, not proof the scene is unsolvable,
                    # so those episodes are still learnable and still carry
                    # reward signal. Filtering them would throw away ~72% of
                    # rollout time, which at ~3.5-4s/env-step is the dominant
                    # cost of a run.

wandb:
  project: dsrl-scan-object
  run: ${now:%H-%M-%S}_${name}
  group: scan_object

# ---------------------------------------------------------------------------
# NOISE PARAMETERIZATION MUST MATCH THE BASE POLICY'S prediction_type
#
# The sampling path itself is agnostic -- diffusers' DDIMScheduler.step
# branches on config.prediction_type internally, so GAP's
# conditional_sample_from_noise runs either parameterization unchanged. What
# is NOT agnostic is which distribution the SAC noise action has to come
# from. train_dsrl_scan_object.py reads the loaded checkpoint's
# prediction_type and validates the settings below against it
# (DSRL_ALLOW_PARAM_MISMATCH=1 overrides).
#
#   prediction_type='epsilon'   <- DSRL's premise holds; what the paper's own
#                                  base policy uses
#       squash_actions:      False
#       standard_gauss_init: True
#       action_magnitude:    1.0
#       target_ent:          363.2     # = 256 * 0.5*log(2*pi*e), i.e. the
#                                  entropy of N(0,1)^256. Principled here: it
#                                  holds the PER-STATE spread at the training
#                                  distribution's, while the MEAN stays free
#                                  to vary with the state -- and that mean is
#                                  the steering.
#
#   prediction_type='sample'    <- this project's checkpoint (GAP.yaml:82,
#                                  deliberate: "predict clean sample (not
#                                  noise!)")
#       Every DDIM step contracts toward the conditional mean, so x_T is
#       washed out: measured authority 0.0035 at 10 steps (~1/370) and 0.0463
#       at 1. No setting below fixes that -- see
#       docs/dsrl-experiments-and-adaptation.md.
# ---------------------------------------------------------------------------
train:
  tau: 0.005
  actor_lr: 3e-4
  batch_size: 256
  train_freq: 1
  utd: 20
  use_layer_norm: True
  layer_size: 2048
  num_layers: 3
  discount: 0.99
  ent_coef: -1
  target_ent: 0.0   # ABSOLUTE nats, summed over ALL 256 action dims -- so it
                    # is parameterization-dependent and cannot be copied
                    # between setups. 0.0 was inherited verbatim from
                    # DSRL-reference's 28-dim robomimic config, where it is
                    # reachable; here a healthy squashed actor sits at
                    # log_prob ~= -174.5, so the tuner's balance term
                    # (log_prob + target_ent) is a permanent -174.5 and
                    # ent_coef collapses to ~0.01 (diagnosed 2026-10-16/18).
                    # Correct values, MEASURED not guessed:
                    #   squash_actions=True   -> 174.5
                    #   squash_actions=False  -> 363.2  (= 256 * 0.5*log(2*pi*e),
                    #                            the entropy of N(0,1)^256)
                    # SB3's own "auto" (-256) is worse than either.
  squash_actions: True   # False replaces SquashedDiagGaussianDistribution with
                    # the unbounded DiagGaussianDistribution. The action here
                    # IS the initial DDIM noise x_T, and tanh makes
                    # |a| > action_magnitude unreachable, so a squashed actor
                    # structurally cannot emit the 13.3% of N(0,1) mass beyond
                    # +-1.5 -- measured, with std matching (0.98 vs 1.00) but
                    # kurtosis 1.61 vs 3.01 and P(|a|>1.5) exactly 0 vs 0.133
                    # (tests/compare_noise_distribution.py). Set
                    # action_magnitude=1.0 alongside it so predict()'s
                    # unscale_action is the identity, and target_ent=363.2.
  standard_gauss_init: False   # zero-init mu and log_std heads, so an
                    # untrained actor is EXACTLY N(0,1). Only meaningful
                    # together with squash_actions=False; with squashing it
                    # just means tanh(0)=0 everywhere.
  init_rollout_steps: 1500   # matches DSRL-reference's robomimic config
                          # (1501); pre-fills the replay buffer with
                          # UNSTEERED diffusion-policy transitions before
                          # SAC trains at all (train_dsrl_scan_object.py's
                          # collect_init_rollouts) -- diagnosed 2026-10-15
                          # as likely necessary: our 256-dim noise space
                          # (vs. their 28-dim) made the near-empty-buffer +
                          # utd=20 combination collapse the actor's entropy
                          # almost immediately. At ~3.5-4s/step this alone
                          # costs ~1.5-1.7h before any SAC gradient step --
                          # override via DSRL_INIT_ROLLOUT_STEPS for a
                          # smaller smoke-test value.
  action_magnitude: 1.5   # DSRL-reference's own tuning range (1-2) -- GAP's
                          # DDIM init noise is a standard normal draw same
                          # as the base policies DSRL was validated on, so
                          # this default is a reasonable starting point, not
                          # yet tuned for GAP specifically.
  n_critics: 2
  critic_backup_combine_type: min

model:
  device: ${device}
